<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/logo/KARMDUDE NEW.webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karmadude - High-performance web development, mobile applications, and AI-driven software solutions. Transforming digital presence with innovation."
    />
    <title>
      Top Services | Web Development, Mobile Development, Custom Developement
    </title>
    <style>
      #kd-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        opacity: 1;
        transition: opacity 0.16s ease-out;
      }
      #kd-boot-loader.is-fading {
        opacity: 0;
        pointer-events: none;
      }
      .kd-boot-stage {
        position: relative;
        width: 68px;
        height: 68px;
        will-change: transform;
        animation: kdBootSettle 0.72s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      @media (min-width: 640px) {
        .kd-boot-stage {
          width: 76px;
          height: 76px;
        }
      }
      .kd-boot-svg {
        width: 100%;
        height: 100%;
        overflow: visible;
        display: block;
      }
      .kd-boot-stem {
        transform-origin: 577px 540px;
        will-change: transform, opacity;
        animation: kdBootStem 0.72s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      .kd-boot-wing {
        transform-origin: 577px 540px;
        will-change: transform, opacity;
        animation: kdBootWing 0.72s cubic-bezier(0.22, 1, 0.36, 1) 1 forwards;
      }
      @keyframes kdBootStem {
        0% {
          transform: translate3d(-135px, 85px, 0) scale(0.94);
          opacity: 0.72;
        }
        48% {
          transform: translate3d(0px, 0px, 0) scale(1.015);
          opacity: 1;
        }
        75%,
        100% {
          transform: translate3d(0px, 0px, 0) scale(1);
          opacity: 1;
        }
      }
      @keyframes kdBootWing {
        0% {
          transform: translate3d(155px, -85px, 0) scale(0.94);
          opacity: 0.72;
        }
        25% {
          transform: translate3d(120px, -65px, 0) scale(0.95);
          opacity: 0.8;
        }
        72% {
          transform: translate3d(-10px, 5px, 0) scale(1.015);
          opacity: 1;
        }
        100% {
          transform: translate3d(0px, 0px, 0) scale(1);
          opacity: 1;
        }
      }
      @keyframes kdBootSettle {
        0%,
        70% {
          transform: scale(1);
        }
        85% {
          transform: scale(1.022);
        }
        100% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .kd-boot-stage,
        .kd-boot-stem,
        .kd-boot-wing {
          animation: none !important;
          transform: none !important;
          opacity: 1 !important;
        }
      }
    </style>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-3S32MSNR54"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-3S32MSNR54");
    </script>
  </head>
  <body>
    <!-- Immediate pre-hydration split-merge K loader (zero white flash on refresh) -->
    <div id="kd-boot-loader" role="status" aria-label="Loading page">
      <div class="kd-boot-stage">
        <svg
          viewBox="0 0 1080 1082"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          class="kd-boot-svg"
          aria-hidden="true"
        >
          <g class="kd-boot-stem" data-k-piece="navy-stem">
            <path d="M 389 37 L 575 37 L 525 210 L 296 362 Z" fill="#20264b" />
            <path d="M 253 512 L 403 635 L 361 779 L 176 779 Z" fill="#20264b" />
          </g>
          <g class="kd-boot-wing" data-k-piece="blue-wing">
            <path
              d="M 700 145 L 978 145 L 486 473 L 905 1042 L 207 473 Z"
              fill="#2f8ecd"
            />
          </g>
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
